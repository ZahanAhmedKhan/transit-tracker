name: Ingest live data

# Fetch GO Transit's live feeds every 5 minutes. GitHub may start scheduled runs late,
# which is fine: each run stores whatever the feed shows at that moment.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      METROLINX_API_KEY: ${{ secrets.METROLINX_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Until the Metrolinx key has been added as a secret there is nothing to fetch.
      # The run then ends with a yellow warning instead of failing every 5 minutes.
      - name: Check the API key is configured
        id: key
        run: |
          if [ -z "$METROLINX_API_KEY" ]; then
            echo "::warning::METROLINX_API_KEY secret is not set yet; skipping ingestion."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ingest.py exits with code 1 if any feed fails, which turns the run red.
      - name: Fetch and store the live feeds
        if: steps.key.outputs.ready == 'true'
        run: python ingest.py
